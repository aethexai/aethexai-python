[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aethexai"
version = "0.2.1"
description = "Official Python SDK for the Aethex voice AI platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Aethex AI", email = "developers@aethexai.com"}]
maintainers = [{name = "Aethex AI", email = "developers@aethexai.com"}]
keywords = ["aethex", "voice-ai", "tts", "stt", "asr", "agents", "voice-agents", "webrtc", "realtime", "transcription", "speech-synthesis", "kora"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0",
    "attrs>=21.3.0",
    "python-dateutil>=2.8.0",
]

[project.urls]
Homepage = "https://aethexai.com"
Documentation = "https://developers.aethexai.com/docs"
Repository = "https://github.com/aethexai/aethexai-python"
Issues = "https://github.com/aethexai/aethexai-python/issues"
Changelog = "https://github.com/aethexai/aethexai-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The realtime extra installs aiortc + aioice + av (PyAV).
#
# av excludes 14.4.0 because that release is published sdist-only (14.3.0 has no
# usable files and 14.2.1 was never released), which forces a from-source build
# that needs FFmpeg dev headers and only compiles against FFmpeg <=7 (AET-1596).
# The constraint resolves to av 14.2.0 — the newest 14.x shipping binary wheels
# (cp310-cp313, manylinux/macOS/Windows) — so supported Pythons install with no
# system FFmpeg. (Alpine/musl has no av-14.x musllinux wheel and still builds
# from source.) Moving av forward is blocked upstream: the aioice<0.10 pin below
# (load-bearing for _aioice_patches.py) caps aiortc at 1.11.0, which itself caps
# av<15 — so av>=15 is unreachable until aioice/aiortc are bumped (AET-1600).
realtime = [
    "aiortc>=1.9.0",
    "aioice>=0.9.0,<0.10",
    "av>=14.0.0,!=14.4.0,<15",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.23.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-python-dateutil",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aethexai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires AETHEX_API_KEY env var and hits dev-api.aethexai.com",
    "slow: longer-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated code is regenerated by openapi-python-client on every backend
# sync; touching it with ruff format would create diff noise on regen.
extend-exclude = ["src/aethexai/_generated/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "PIE", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts allowed in tests
"src/aethexai/_generated/*" = ["ALL"]  # generated code
# Hand-written WebRTC layer — intentional optional-dep availability checks
# (F401 import-only-to-check-installed, B904 inside ImportError handlers,
# SIM102/105 stylistic preferences that don't apply to this code).
"src/aethexai/realtime/*" = ["F401", "B904", "SIM102", "SIM105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
# Exclude generated code (too noisy + regenerated), tests, scripts, examples,
# and realtime/ (uses optional deps aiortc/av without type stubs — strict mode
# can't help us here, and the extras aren't installed in the lint env).
exclude = [
    "src/aethexai/_generated/",
    "src/aethexai/realtime/",
    "tests/",
    "scripts/",
    "examples/",
]

[[tool.mypy.overrides]]
module = "aethexai._generated.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aethexai.realtime.*"
ignore_errors = true
